name: Flyway migration smoke test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flyway-migration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_migration_test
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: migration_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_TEST_DB_URL: jdbc:postgresql://localhost:5432/crm_migration_test
      MIGRATION_TEST_DB_USERNAME: crm_test
      MIGRATION_TEST_DB_PASSWORD: migration_test_only

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Flyway migration smoke test
        working-directory: backend
        run: bash ./mvnw -B -Dtest=FlywayMigrationSmokeTest test
